# nginx front door for the self-hosted stack.
#
#   /api/           -> api:8000   (SSE-safe: no buffering, no cache, long read)
#   /_next/static/  -> web:3000   (immutable build assets)
#   /               -> web:3000
#
# Upstream hostnames are resolved once at nginx start; compose gates nginx on
# both services being healthy, so a missing host is a configuration error, not
# a transient one. No TLS here on purpose: put this behind a TLS terminator (or
# add a 443 server block) for anything reachable from the internet; see
# infra/README.md.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Request body limit: the API accepts JSON payloads only (pasted code is
    # capped at ~50 KB by the app itself), so 2 MB is already generous.
    client_max_body_size 2m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # WebSocket-style upgrades are not used today, but keeping the map means a
    # future streaming endpoint does not need a config rewrite.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream synapse_api {
        server api:8000;
        keepalive 32;
    }

    upstream synapse_web {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Container healthcheck target: does not touch either upstream.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://synapse_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE-safe: stream tokens as they are produced instead of holding
            # them in nginx buffers, and allow a long-lived response.
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        location /_next/static/ {
            proxy_pass http://synapse_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            expires 1h;
            add_header Cache-Control "public, max-age=3600, immutable";
        }

        location / {
            proxy_pass http://synapse_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}