# Alembic configuration for the auth tables.
#
# The database URL is intentionally empty here: alembic/env.py resolves
# SYNAPSE_DATABASE_URL (or the same SQLite default the API uses), so one
# checked-in config migrates both a local file and the compose PostgreSQL
# instance:
#
#   cd apps/api
#   alembic upgrade head
#   SYNAPSE_DATABASE_URL=postgresql+psycopg://synapse:synapse@postgres:5432/synapse \
#     alembic upgrade head
#
# ``%(here)s`` keeps script_location and sys.path correct when -c is used from
# the repository root.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S